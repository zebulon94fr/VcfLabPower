# vcf_lab_shutdown.conf — configuration de vcf_lab_shutdown.sh
#
# Fichier bash « sourcé ». Les noms de VM sont les noms d'inventaire vCenter
# (un MoRef « VirtualMachine:vm-123 » est aussi accepté). Une liste vide
# saute l'étape correspondante.
#
# Les secrets se passent de préférence par variables d'environnement
# (GOVC_PASSWORD, VMSP_PASSWORD, VCFOPS_ADMIN_PASSWORD, ESX_ROOT_PASSWORD) ;
# sinon ils sont demandés au lancement.

# --- vCenter de gestion -----------------------------------------------------
GOVC_URL="https://vc-mgmt.lab.local"
GOVC_USERNAME="administrator@vsphere.local"
GOVC_INSECURE="true"

MGMT_CLUSTER="cl-mgmt-01"
VCENTER_VM="vc-mgmt"

# --- Hôtes ESX du cluster de gestion ----------------------------------------
# Noms tels qu'ils apparaissent dans vCenter (et résolvables pour SSH).
# vSAN : le premier hôte exécute reboot_helper.py et s'éteint en dernier.
# NFS : liste ignorée (hôtes lus dans le cluster, l'hôte du vCenter en dernier).
ESX_HOSTS=(
  "esx-mgmt-01.lab.local"
  "esx-mgmt-02.lab.local"
  "esx-mgmt-03.lab.local"
)
ESX_SSH_USER="root"
ENABLE_ESX_SSH="true"   # démarre TSM-SSH via vCenter pendant les pré-vérifications

# --- Étape 0 : workloads / VMs hors VCF du domaine de gestion ----------------
WORKLOAD_VMS=(
  # "vm-test-01"
)

# --- Étape 1 : VCF Automation -----------------------------------------------
# ui   = pause : power-off via VCF Operations (méthode doc), puis contrôle des VMs
# vm   = Shut down Guest OS direct des VMs (raccourci de lab, non conforme doc)
# none = non déployé
VCFA_MODE="ui"
VCFA_VMS=(
  # "vcfa-01"
)

# --- Étape 2 : VCF Operations for networks ----------------------------------
VCFNET_MODE="none"
VCFNET_VMS=(
  # Ordre d'arrêt en mode vm : collectors puis platform
  # "vcfnet-collector-01"
  # "vcfnet-platform-01"
)

# --- Étape 3 : cloud proxies -------------------------------------------------
CLOUD_PROXY_VMS=(
  "vcfops-cp-01"
)

# --- Étape 4 : license server ------------------------------------------------
LICENSE_SERVER_VMS=(
  "vcf-license-01"
)

# --- Étape 5 : VCF services runtime (VCF management services) ---------------
# FQDN (ou VIP) du VCF services runtime — PAS l'IP d'un nœud : sur 9.1.1,
# les IP des nœuds acceptent le login mais renvoient 404 sur l'API de gestion.
# (VCF Operations > Build > Lifecycle > VCF Management Components > VCF services runtime)
VCFMS_NODE_IP="services.lab.local"
VCFMS_NODE_PORT=5480
# Script officiel (KB 440874), par défaut à côté de ce script :
# VCFMS_SHUTDOWN_SCRIPT="/chemin/vcf_services_runtime_shutdown.sh"
# Si l'API ne renvoie pas la liste des nœuds (HTTP 404 sur certains builds 9.1.1) :
#   1) VCFMS_VMS : noms exacts des VMs (prioritaire)
#   2) VCFMS_VM_PATTERN : motif glob govc, utile si les nœuds sont redéployés
#      avec un suffixe aléatoire. Vérifie d'abord ce qu'il trouve :
#        govc find / -type m -name 'motif*'
VCFMS_VMS=(
  # "vcfms-cp-01"
)
VCFMS_VM_PATTERN=""   # ex. "vcf-services-runtime-*"
# Kubeconfig du VCF services runtime, si la version du script officiel
# l'exige (option --kubeconfig, cf. KB 440874) :
VCFMS_KUBECONFIG=""

# --- Étape 6 : VCF Operations ------------------------------------------------
# api = Take cluster offline via l'API CaSA (KB 313533) ; ui = pause manuelle
VCFOPS_OFFLINE_MODE="api"
VCFOPS_PRIMARY_FQDN="vcfops.lab.local"
VCFOPS_ADMIN_USER="admin"
# ORDRE KB 341964 : data node(s) → primary replica → primary (en dernier)
VCFOPS_VMS=(
  "vcfops-01"
)

# --- Étape 7 : protection & recovery (VMware Live Site Recovery) -------------
VLSR_VMS=()

# --- Étape 8 : NSX Edge / VNA du domaine de gestion --------------------------
NSX_EDGE_VMS=(
  "edge-mgmt-01"
  "edge-mgmt-02"
)

# --- Étape 9 : NSX Manager ---------------------------------------------------
NSX_MANAGER_VMS=(
  "nsx-mgmt-01a"
)

# --- Étape 10 : SDDC Manager -------------------------------------------------
SDDC_MANAGER_VM="sddc-manager"

# --- Étape 11 : vCenter, VMs d'infra, vSAN, ESX ------------------------------
# VMs d'infra (DNS, NTP, AD, DHCP...) hébergées sur le cluster : arrêtées
# APRÈS le vCenter.
INFRA_VMS=(
  # "dns-01"
)
# Stockage principal du cluster de gestion :
#   vsan = procédure vSAN (VSAN_SHUTDOWN_MODE ci-dessous, SSH vers les ESX)
#   nfs  = NFS ou Fibre Channel (pas de SSH : connexion directe à l'ESX du
#          vCenter avec ESX_SSH_USER / ESX_ROOT_PASSWORD, comme le Host Client)
MGMT_STORAGE="vsan"
# vSAN uniquement :
# manual = scripté (vCenter + reboot_helper.py + maintenance noAction + poweroff)
# wizard = s'arrête avant et affiche la procédure vSAN Shutdown Cluster wizard
VSAN_SHUTDOWN_MODE="manual"
# true si le witness vSAN est partagé entre plusieurs clusters 2 nœuds :
# reboot_helper.py interdit (KB 455801) → forcer wizard
VSAN_SHARED_WITNESS="false"

# --- Délais (secondes) -------------------------------------------------------
VM_SHUTDOWN_TIMEOUT=600
VCFOPS_OFFLINE_TIMEOUT=3600
ESX_SHUTDOWN_TIMEOUT=900
POLL_INTERVAL=10

# LOG_DIR="${SCRIPT_DIR}/logs"
